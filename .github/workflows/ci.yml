name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # The tests load a real model. Pin the revision as well as the name: a
  # re-upload of the repo would otherwise change what the suite is testing.
  SO1_TEST_MODEL: Qwen/Qwen2.5-0.5B-Instruct
  SO1_TEST_REVISION: 7ae557604adf67be50417f59c2c2f167def9a775
  SO1_TEST_REQUIRE_MODEL: "1"   # a run that skipped every model test is not a pass
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache the test model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.SO1_TEST_MODEL }}-${{ env.SO1_TEST_REVISION }}

      - name: Install (CPU torch, pinned)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
                      -c ci/constraints.txt -e ".[dev]"

      - name: Versions under test
        run: |
          python - <<'PY'
          import accelerate, torch, transformers
          print("torch", torch.__version__)
          print("transformers", transformers.__version__)
          print("accelerate", accelerate.__version__)
          PY

      - run: python -m pytest -q

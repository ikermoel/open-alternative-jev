[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-alternative-jev"
version = "0.1.0"
description = "Open alternative to Jev. Open-source System One models: typed, calibrated decisions from any open-weights LLM in one forward pass."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Iker Moel Tacher" }]
keywords = ["jev", "typesafe-jev", "open-source-jev", "jev-alternative", "system-one", "system-one-model", "llm", "classification", "structured-decisions", "typed-decisions", "logits", "logprobs", "calibration", "vllm", "transformers", "qwen", "open-weights"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.1", "transformers>=4.51", "accelerate>=0.30"]

[project.optional-dependencies]
vllm = ["vllm>=0.10"]
quant = ["bitsandbytes>=0.43"]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/ikermoel/open-alternative-jev"

[tool.setuptools.packages.find]
include = ["so1*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
